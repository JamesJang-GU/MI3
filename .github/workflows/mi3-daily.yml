name: mi3-daily

# 01:00 KST (00:00 UTC) — MI2's 00:00 KST crawl has finished by then.
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mi3-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone MI2 data (latest summary.json + SQLite)
        run: git clone --depth 1 https://github.com/JamesJang-GU/MI2.git ../MI2

      - name: Sync MI2 interactive freight detail screens
        run: |
          mkdir -p mi2/{sea,air,linerlytica,alphaliner}
          cp ../MI2/sea/index.html mi2/sea/index.html
          cp ../MI2/sea/sea_data.json mi2/sea/sea_data.json
          cp ../MI2/air/detail.html mi2/air/detail.html
          cp ../MI2/linerlytica/detail.html mi2/linerlytica/detail.html
          cp ../MI2/alphaliner/detail.html mi2/alphaliner/detail.html
          sed -i 's|href="../index.html"|href="../../index.html"|g' mi2/sea/index.html mi2/air/detail.html mi2/linerlytica/detail.html mi2/alphaliner/detail.html

      - name: Fetch WorldMonitor public data
        run: python3 fetch_worldmonitor.py --public-only

      - name: Build MI3 dashboard
        run: |
          python3 build.py
          python3 make_standalone.py

      - name: Commit & push
        run: |
          git config user.name "mi3-bot"
          git config user.email "mi3-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: mi3 daily build $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
